services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # les données survivent à un redémarrage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-myuser} -d $${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./savings-backend
    depends_on:
      postgres:
        condition: service_healthy        # l'API attend que la base soit prête
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydatabase}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myuser}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"   # inutile dans un conteneur
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env}
    ports:
      - "8080:8080"                       # pratique pour Swagger / Postman

  frontend:
    build: ./savings-frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
